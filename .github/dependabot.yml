# A pinned action is only as good as its pin: this keeps the pins current, one grouped pull request
# a week, so the release workflow is never stuck on a commit nobody is patching. The pins stay SHAs;
# dependabot rewrites the SHA and the trailing comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci: "
    groups:
      actions:
        patterns: ["*"]
    # Minor and patch bumps land as a pull request that the test workflow runs. A major bump changes
    # the runtime and the inputs of the action that publishes releases, and no pull request
    # exercises the tag path — so those are read and applied by hand, not merged on a green check.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "go: "
    groups:
      deps:
        patterns: ["*"]
