# Release binaries, so nobody has to install Go and clone a repo to try the tool.
#
# `goreleaser release --snapshot --clean` builds locally; pushing a tag builds and publishes the
# same artifacts from .github/workflows/release.yml. The ldflags are the Makefile's, with
# `Version` filled in from the tag — a release binary must answer `evalctl version` with the number
# somebody downloaded, and stamp its build time so a stale copy is visible in the TUI's corner.
version: 2

project_name: evalctl

builds:
  - id: evalctl
    main: .
    binary: evalctl
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    # -trimpath keeps the builder's directory out of the binary (a release should not carry
    # /home/runner/work/...), and the timestamp is the commit's, so the same tag builds the same
    # bytes twice: a rebuild that differs is then a fact worth explaining rather than noise.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X evalctl/internal/version.Version={{.Version}}
      - -X evalctl/internal/version.Commit={{.Commit}}
      - -X evalctl/internal/version.BuiltAt={{.Date}}
      - -X evalctl/internal/version.Modified={{.IsGitDirty}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: true
  footer: |
    **evalctl {{ .Tag }}** — the eval runner for Hermes skills. One binary per platform, no runtime.

    Starting a project: `evalctl init --skill <name> --profile <hermes-profile>`, then
    [docs/tutorials/first-eval.md](docs/tutorials/first-eval.md).
